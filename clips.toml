# Real footage for `python -m so serve --video [clip]`. Download the files listed in
# footage/SOURCES.md (or run `python tools/fetch_data.py footage`). A clip only shows up if its
# file is on disk.
#
#   view      [x, y, w, h] crop of the source frame that becomes the camera image
#   start/end seconds of video
#   every     use every n-th frame (30 fps footage -> every = 2)
#   truth     altitude record (t, alt_m); without one the clip is tracking-only
#   mm_per_m  rig scale for that altitude (the engine and dashboard work in mm)
#   tau_gain  constant factor for a camera that is not pointing straight down
#   hazard    false hides the hazard-map overlay (it assumes a straight-down camera)

[blue_ghost]
name = "Blue Ghost Mission 1"
mission = "Firefly Aerospace · Moon, 2 March 2025 · NASA SCALPSS camera SFL2"
credit = "NASA / Firefly Aerospace"
file = "footage/blue_ghost_m1_landing_scalpss.mp4"
view = [0, 424, 512, 344]
start = 0.0
end = 14.0          # the engine plume hides the surface after this
truth = "eval/truth/blue_ghost_m1_callouts.csv"
mm_per_m = 10
# The SCALPSS cameras look outward, not straight down, so raw time-to-contact reads long.
# 0.598 was fitted on the first 4 s only; eval/run_video.py --calib-s 4 scores the rest.
tau_gain = 0.598
hazard = true       # shown because it reads well; this camera is oblique, so treat the grid as indicative, not measured
note = "Camera: real footage. Altitude: NASA's on-screen labels, 10 mm = 1 m. Rangefinder and inertial are generated from those labels."

[perseverance]
name = "Perseverance"
mission = "NASA/JPL · Mars, 18 February 2021 · rover down-look camera"
credit = "NASA/JPL-Caltech"
file = "footage/perseverance_descent_touchdown_1080p.mp4"
view = [424, 2, 1124, 896]
start = 60.0
end = 164.0         # rocket dust hides the ground after this
every = 2
hazard = false
note = "Tracking only: this video has no altitude record, so nothing is voted on."

[dart]
name = "DART"
mission = "NASA/Johns Hopkins APL · asteroid Dimorphos, 26 September 2022 · DRACO camera"
credit = "NASA/Johns Hopkins APL"
file = "footage/dart_impact_replay.mp4"
view = [450, 0, 1020, 1020]
start = 24.5
end = 34.4          # last complete image before impact
hazard = false
note = "Tracking only: NASA's replay is a time-lapse with uneven speed, so seconds of video are not seconds of flight."

# ---- the crash broadcasts -------------------------------------------------------------------
# These are the missions' own live broadcasts. The altitude record is the lander telemetry shown
# on screen, read off every 5 s of video (eval/truth/*_broadcast.csv). There is no descent
# camera in them, so the camera witness is reconstructed from the altitude, not measured.
#
#   fit       "linear" joins the readings with straight lines (default: a smooth cubic)
#   believed  true = the record is what the lander BELIEVED, not where it was; the true altitude
#             is that plus offset_m from offset_at (seconds of video) onward
#   camera    "reconstructed" = no vision: time-to-contact is computed from the true altitude
#   site      with a reconstructed camera, the ground photo to draw the camera view over (the
#             broadcast then becomes a second view), and site_width_m how many metres across it is

[hakuto_r]
name = "HAKUTO-R Mission 1"
mission = "ispace · Moon, 25 April 2023 · ispace live broadcast"
credit = "© ispace"
file = "footage/broadcasts/hakuto_r_m1.mp4"
view = [412, 0, 868, 720]    # leaves out the mission-control audience inset on the left
start = 125.0
end = 203.0
every = 2
truth = "eval/truth/hakuto_r_m1_broadcast.csv"
fit = "linear"
mm_per_m = 0.5
believed = true
offset_m = 5000     # ispace, 26 May 2023: the lander judged it had landed while about 5 km up
offset_at = 133.0   # ASSUMED. ispace published the size of the error, not when in this video it began
camera = "reconstructed"
site = "scenarios/sites/hakuto_r_m1.jpg"
site_width_m = 1000   # ASSUMED: LROC photos of these sites are about a kilometre across, but the scale bar was cropped away
hazard = false
replay_only = true
# The broadcast badges its telemetry panel "UPDATE" for most of the clip and "simulation" near the
# end, so the on-screen altitude is ispace's display of the descent, not guaranteed raw telemetry.
note = "Camera: simulated over NASA's LRO photo of the impact site, from the true altitude. The control-center broadcast is the second view. Red follows the altitude on ispace's own broadcast display (it marks that panel 'simulation' near the end). White is that plus the 5 km error ispace reported. Rangefinder is reconstructed from the white line; when the error begins is assumed."

[resilience]
name = "Resilience (Mission 2)"
mission = "ispace · Moon, 5 June 2025 · ispace live broadcast"
credit = "© ispace"
file = "footage/broadcasts/resilience.mp4"
view = [275, 0, 1005, 720]   # leaves out the presenter inset on the left
start = 150.0       # the last 25 s. Started at 120 s instead, Subsidium does NOT isolate the lag (inertial has drifted too long to vouch for the camera)
end = 175.5         # the last altitude shown is 52 m at 187 km/h; the next reading is -223 m, then nothing
truth = "eval/truth/resilience_broadcast.csv"
fit = "linear"
mm_per_m = 0.5
camera = "reconstructed"
site = "scenarios/sites/resilience.jpg"
site_width_m = 1040   # from the site note: the LRO photo is 1040 m across
hazard = false
replay_only = true
note = "Camera: simulated over NASA's LRO photo of the impact site. The control-center broadcast is the second view. White is the altitude on ispace's own broadcast display. Rangefinder and inertial are reconstructed from it; the rangefinder lag is injected, its real size was not published."
