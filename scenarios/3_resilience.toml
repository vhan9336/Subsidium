id = "resilience"
name = "Resilience (Mission 2)"
mission = "ispace · June 2025"
summary = "The laser rangefinder degraded and valid measurements came too late for the lander to slow down. Telemetry was lost about 193 m up, descending at about 42 m/s."
source = "ispace Mission 2 report, June 2025; Payload, SpacePolicyOnline"
setup = "Flat ground under the lander."
expect = "Legacy follows the slowly lagging rangefinder and believes it is higher than it is. Second Opinion: inertial + camera outvote the rangefinder."
site = "scenarios/sites/resilience.jpg"
site_note = "Ground: NASA LRO image M1504323448 of the actual impact site, 11 June 2025 (60.44°N, 355.41°E), 1040 m across. Credit NASA/GSFC/Arizona State University."
broadcast = "footage/broadcasts/resilience.mp4"
broadcast_at = 120
broadcast_note = "ispace's Mission 2 landing broadcast, 5 June 2025, with the lander telemetry display. Telemetry stops before touchdown. Footage © ispace."
# With `serve --video` this replay flies on the mission's own broadcast and telemetry (clips.toml).
clip = "resilience"
steps = [
  { at = 0.0, do = ["fault:clear", "terrain_down", "reset"] },
  { at = 0.5, do = ["descend"] },
  { at = 3.0, do = ["fault:rf_lag"], cue = "Rangefinder degrading (injected lag)" },
]
