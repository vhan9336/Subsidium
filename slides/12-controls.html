<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="slide.css">
<title>Controls</title>
<h1>Controls</h1>
<p class="lead">Everything has a key.</p>
<dl class="rows keys">
<div><dt>1 to 5</dt><dd>Run a mission replay</dd></div>
<div><dt>M</dt><dd>Open or close the math screen</dd></div>
<div><dt>C</dt><dd>Swap the camera and 3D views</dd></div>
<div><dt>V</dt><dd>Voice callouts on or off</dd></div>
<div><dt>E</dt><dd>This walkthrough</dd></div>
<div><dt>D S U R</dt><dd>Descend, stop, go up, reset</dd></div>
<div><dt>T Y</dt><dd>Move a plateau in or out</dd></div>
<div><dt>0</dt><dd>Clear injected faults</dd></div>
</dl>
